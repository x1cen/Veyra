name: Build and Release Veyra APK

on:
    workflow_dispatch:
        inputs:
            veyra-version:
                description: 'Veyra version'
                type: string
                default: '13.0.2'
            arch:
                description: 'Target Architecture (auto = all for main, arm64-v8a for dev)'
                type: choice
                options:
                    - 'auto'
                    - 'arm64-v8a'
                    - 'arm64-v8a,armeabi-v7a'
                    - 'all'
                default: 'auto'
            veyra-changes:
                description: 'Changelog / Release notes'
                type: string
                default: 'Veyra Release'
            multi-pass:
                description: 'Signing mode'
                type: choice
                options:
                    - Multipass
                    - Korben Dallas
                default: 'Korben Dallas'
            prerelease:
                description: 'Mark as pre-release?'
                type: boolean
                default: false

permissions:
    contents: write

concurrency:
    group: veyra-build-${{ github.ref }}
    cancel-in-progress: false

run-name: Building Veyra ${{ inputs.veyra-version || (github.ref_name == 'main' && '13.0.2' || '13.0.2-dev') }} [${{ (inputs.arch == 'auto' || !inputs.arch) && (github.ref_name == 'main' && 'all' || 'arm64-v8a') || inputs.arch }}]

jobs:
    apk:
        name: Generate APK
        runs-on: ubuntu-latest
        env:
            TARGET_ARCH: ${{ (inputs.arch == 'auto' || !inputs.arch) && (github.ref_name == 'main' && 'all' || 'arm64-v8a') || inputs.arch }}
            CCACHE_DIR: ${{github.workspace}}/.ccache
            # 6G: arm64 tgcalls+boringssl alone push past 4G of intermediate objects
            CCACHE_MAXSIZE: 6G
            # mtime is faster and more stable across homogeneous runners than content hash
            CCACHE_COMPILERCHECK: mtime
            CCACHE_NOHASHDIR: "1"
            # pch_defines+system_headers: avoid rehashing NDK STL/PCH every build
            CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime,file_stat_matches,system_headers
            CCACHE_COMPRESS: "1"
            CCACHE_COMPRESSLEVEL: "1"
            # Hardlink lets ccache reflink objects on the same fs — avoids copy overhead
            CCACHE_HARDLINK: "1"
            GRADLE_OPTS: "-Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dorg.gradle.configureondemand=true -Dorg.gradle.daemon=true -Xmx6g -XX:+UseG1GC"
            CMAKE_BUILD_PARALLEL_LEVEL: "4"
            VERSION_NAME: ${{ inputs.veyra-version || (github.ref_name == 'main' && '13.0.2' || '13.0.2-dev') }}
            IS_STABLE: ${{ github.ref_name == 'main' && inputs.prerelease != true }}
        steps:
            -   name: Checkout
                uses: actions/checkout@v6
                with:
                    submodules: recursive
                    fetch-depth: 1

            -   name: Set up AWS Corretto 21
                uses: actions/setup-java@v5
                with:
                    java-version: '21'
                    distribution: 'corretto'
                    architecture: x64

            -   name: Setup Gradle 8.14.5
                uses: gradle/actions/setup-gradle@v6
                with:
                    gradle-version: '8.14.5'
                    cache-read-only: false

            -   name: Cache NDK & CMake
                uses: actions/cache@v5
                with:
                    path: |
                        /usr/local/lib/android/sdk/ndk/27.2.12479018
                        /usr/local/lib/android/sdk/cmake/3.22.1
                    key: ndk27-cmake322-${{ runner.os }}-v2

            -   name: Cache Aether Core
                uses: actions/cache@v5
                with:
                    path: |
                        TMessagesProj/jni/arm64-v8a/libaether.so
                        TMessagesProj/jni/armeabi-v7a/libaether.so
                        TMessagesProj/jni/x86_64/libaether.so
                        TMessagesProj_AppStandalone/src/main/jniLibs/arm64-v8a/libaether.so
                        TMessagesProj_AppStandalone/src/main/jniLibs/armeabi-v7a/libaether.so
                        TMessagesProj_AppStandalone/src/main/jniLibs/x86_64/libaether.so
                    # Key on aether version only — jni source changes must NOT bust aether binary cache
                    key: aether-v2.3.0-bins
                    restore-keys: |
                        aether-v2.3.0-bins

            -   name: Pin CMake 3.22.1 and NDK 27.2.12479018
                run: |
                    set -euo pipefail
                    SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
                    CMAKE_DIR="${ANDROID_HOME}/cmake/3.22.1"
                    NDK_DIR="${ANDROID_HOME}/ndk/27.2.12479018"
                    install_pkg() {
                      set +o pipefail
                      echo y | "${SDKMANAGER}" --install "$1"
                      set -o pipefail
                    }
                    if [ ! -x "${CMAKE_DIR}/bin/cmake" ]; then install_pkg "cmake;3.22.1"; fi
                    if [ ! -d "${NDK_DIR}" ]; then install_pkg "ndk;27.2.12479018"; fi
                    printf 'sdk.dir=%s\ncmake.dir=%s\n' "${ANDROID_HOME}" "${CMAKE_DIR}" > local.properties
                    echo "ANDROID_NDK_HOME=${NDK_DIR}" >> "${GITHUB_ENV}"
                    "${CMAKE_DIR}/bin/cmake" --version

            -   name: Install ccache and nasm
                run: |
                    command -v ccache >/dev/null 2>&1 || { sudo apt-get update -qq; sudo apt-get install -y -qq ccache nasm; }
                    command -v nasm >/dev/null 2>&1 || sudo apt-get install -y -qq nasm
                    mkdir -p "${CCACHE_DIR}"
                    ccache --max-size=6G >/dev/null 2>&1 || true
                    # Do NOT zero stats here — we need history for hit-rate analysis
                    ccache -s || true

            -   name: Cache ccache
                uses: actions/cache@v5
                with:
                    path: ${{github.workspace}}/.ccache
                    # Key on JNI C/C++ sources + CMakeLists ONLY — Java/Kotlin changes must NOT bust C cache
                    key: ${{runner.os}}-ccache-ndk27-v2-${{hashFiles('TMessagesProj/jni/**/*.c', 'TMessagesProj/jni/**/*.cpp', 'TMessagesProj/jni/**/*.h', 'TMessagesProj/**/CMakeLists.txt')}}
                    restore-keys: |
                        ${{runner.os}}-ccache-ndk27-v2-
                        ${{runner.os}}-ccache-ndk27-

            -   name: ccache before build
                run: |
                    echo "=== ccache config ==="
                    echo "CCACHE_DIR=${CCACHE_DIR}"
                    du -sh "${CCACHE_DIR}" 2>/dev/null || echo "(empty)"
                    ccache -s

            -   name: Inject API Secrets
                env:
                    APP_ID: ${{secrets.APP_ID || secrets.API_ID}}
                    APP_HASH: ${{secrets.APP_HASH || secrets.API_HASH}}
                    GOOGLE_API_KEY: ${{secrets.GOOGLE_API_KEY}}
                    DEVELOPER_USER_ID: ${{secrets.DEVELOPER_USER_ID}}
                    SPECIAL_TITLE_USER_ID: ${{secrets.SPECIAL_TITLE_USER_ID}}
                    SPECIAL_TITLE_TEXT: ${{secrets.SPECIAL_TITLE_TEXT}}
                run: |
                    set +x
                    if [ -n "$APP_ID" ] && [ -n "$APP_HASH" ]; then
                        echo "Configuring APP_ID and APP_HASH from repository secrets..."
                        sed -i "s/public static int APP_ID = .*/public static int APP_ID = $APP_ID;/g" TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
                        sed -i "s/public static String APP_HASH = .*/public static String APP_HASH = \"$APP_HASH\";/g" TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
                    fi
                    if [ -n "$DEVELOPER_USER_ID" ]; then
                        echo "Configuring DEVELOPER_USER_ID from repository secrets..."
                        sed -i "s/public static long DEVELOPER_USER_ID = .*/public static long DEVELOPER_USER_ID = ${DEVELOPER_USER_ID}L;/g" TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
                    fi
                    if [ -n "$SPECIAL_TITLE_USER_ID" ]; then
                        echo "Configuring SPECIAL_TITLE_USER_ID from repository secrets..."
                        sed -i "s/public static long SPECIAL_TITLE_USER_ID = .*/public static long SPECIAL_TITLE_USER_ID = ${SPECIAL_TITLE_USER_ID}L;/g" TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
                    fi
                    if [ -n "$SPECIAL_TITLE_TEXT" ]; then
                        echo "Configuring SPECIAL_TITLE_TEXT from repository secrets..."
                        sed -i "s/public static String SPECIAL_TITLE_TEXT = .*/public static String SPECIAL_TITLE_TEXT = \"$SPECIAL_TITLE_TEXT\";/g" TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
                    fi
                    if [ -n "$GOOGLE_API_KEY" ]; then
                        echo "Injecting Google API Key from secrets..."
                        sed -i "s/REDACTED_VEYRA_GOOGLE_SERVICES_KEY/$GOOGLE_API_KEY/g" TMessagesProj*/google-services.json
                        sed -i "s/REDACTED_VEYRA_MAPS_KEY/$GOOGLE_API_KEY/g" TMessagesProj/config/*/*.xml
                    fi

            -   name: Enable Custom Keystore
                if: ${{ (inputs.multi-pass || 'Korben Dallas') == 'Korben Dallas' }}
                env:
                    VEYRA_KEYSTORE_BASE64: ${{secrets.VEYRA_KEYSTORE_BASE64}}
                    VEYRA_RELEASE_STORE_PASSWORD: ${{secrets.VEYRA_RELEASE_STORE_PASSWORD || 'veyra_release_pass_2026'}}
                    VEYRA_RELEASE_KEY_ALIAS: ${{secrets.VEYRA_RELEASE_KEY_ALIAS || 'veyra'}}
                    VEYRA_RELEASE_KEY_PASSWORD: ${{secrets.VEYRA_RELEASE_KEY_PASSWORD || 'veyra_release_pass_2026'}}
                run: |
                    if [ -n "$VEYRA_KEYSTORE_BASE64" ]; then
                        mv "${GITHUB_WORKSPACE}/TMessagesProj/config/release.keystore" "${GITHUB_WORKSPACE}/TMessagesProj/config/release.keystore.old"
                        echo "$VEYRA_KEYSTORE_BASE64" | base64 --decode > "${GITHUB_WORKSPACE}/TMessagesProj/config/release.keystore"
                        cp "${GITHUB_WORKSPACE}/gradle.properties" "${GITHUB_WORKSPACE}/gradle.properties.old"
                        sed -i "s/RELEASE_STORE_PASSWORD=.*/RELEASE_STORE_PASSWORD=$VEYRA_RELEASE_STORE_PASSWORD/g" "${GITHUB_WORKSPACE}/gradle.properties"
                        sed -i "s/RELEASE_KEY_ALIAS=.*/RELEASE_KEY_ALIAS=$VEYRA_RELEASE_KEY_ALIAS/g" "${GITHUB_WORKSPACE}/gradle.properties"
                        sed -i "s/RELEASE_KEY_PASSWORD=.*/RELEASE_KEY_PASSWORD=$VEYRA_RELEASE_KEY_PASSWORD/g" "${GITHUB_WORKSPACE}/gradle.properties"
                    fi

            -   name: Setup Aether Core
                run: |
                    if [ -f "${GITHUB_WORKSPACE}/TMessagesProj/jni/arm64-v8a/libaether.so" ] && [ -s "${GITHUB_WORKSPACE}/TMessagesProj/jni/arm64-v8a/libaether.so" ]; then
                      echo "Aether cached — ensure jniLibs copy..."
                      mkdir -p "${GITHUB_WORKSPACE}/TMessagesProj_AppStandalone/src/main/jniLibs/arm64-v8a"
                      cp -f "${GITHUB_WORKSPACE}/TMessagesProj/jni/arm64-v8a/libaether.so" "${GITHUB_WORKSPACE}/TMessagesProj_AppStandalone/src/main/jniLibs/arm64-v8a/libaether.so" 2>/dev/null || true
                      if [ "${TARGET_ARCH}" = "all" ]; then
                        mkdir -p "${GITHUB_WORKSPACE}/TMessagesProj_AppStandalone/src/main/jniLibs/armeabi-v7a" "${GITHUB_WORKSPACE}/TMessagesProj_AppStandalone/src/main/jniLibs/x86_64"
                        cp -f "${GITHUB_WORKSPACE}/TMessagesProj/jni/armeabi-v7a/libaether.so" "${GITHUB_WORKSPACE}/TMessagesProj_AppStandalone/src/main/jniLibs/armeabi-v7a/libaether.so" 2>/dev/null || true
                        cp -f "${GITHUB_WORKSPACE}/TMessagesProj/jni/x86_64/libaether.so" "${GITHUB_WORKSPACE}/TMessagesProj_AppStandalone/src/main/jniLibs/x86_64/libaether.so" 2>/dev/null || true
                      fi
                      ls -lh "${GITHUB_WORKSPACE}/TMessagesProj/jni/arm64-v8a/libaether.so"
                      exit 0
                    fi
                    mkdir -p "${GITHUB_WORKSPACE}/TMessagesProj/jni/arm64-v8a"
                    echo "Fetching Aether arm64 core..."
                    curl -sL https://github.com/CluvexStudio/Aether/releases/download/v2.3.0/aether-android-arm64.tar.gz | tar -xz -C "${GITHUB_WORKSPACE}/TMessagesProj/jni/arm64-v8a" aether
                    mv "${GITHUB_WORKSPACE}/TMessagesProj/jni/arm64-v8a/aether" "${GITHUB_WORKSPACE}/TMessagesProj/jni/arm64-v8a/libaether.so"
                    chmod 755 "${GITHUB_WORKSPACE}/TMessagesProj/jni/arm64-v8a/libaether.so"
                    # Bundle as jniLibs so it extracts to nativeLibraryDir (executable, not noexec files/)
                    mkdir -p "${GITHUB_WORKSPACE}/TMessagesProj_AppStandalone/src/main/jniLibs/arm64-v8a"
                    cp "${GITHUB_WORKSPACE}/TMessagesProj/jni/arm64-v8a/libaether.so" "${GITHUB_WORKSPACE}/TMessagesProj_AppStandalone/src/main/jniLibs/arm64-v8a/libaether.so"
                    if [ "${TARGET_ARCH}" = "all" ]; then
                        mkdir -p "${GITHUB_WORKSPACE}/TMessagesProj/jni/armeabi-v7a" "${GITHUB_WORKSPACE}/TMessagesProj/jni/x86_64"
                        curl -sL https://github.com/CluvexStudio/Aether/releases/download/v2.3.0/aether-android-armv7.tar.gz | tar -xz -C "${GITHUB_WORKSPACE}/TMessagesProj/jni/armeabi-v7a" aether
                        mv "${GITHUB_WORKSPACE}/TMessagesProj/jni/armeabi-v7a/aether" "${GITHUB_WORKSPACE}/TMessagesProj/jni/armeabi-v7a/libaether.so"
                        chmod 755 "${GITHUB_WORKSPACE}/TMessagesProj/jni/armeabi-v7a/libaether.so"
                        curl -sL https://github.com/CluvexStudio/Aether/releases/download/v2.3.0/aether-android-x86_64.tar.gz | tar -xz -C "${GITHUB_WORKSPACE}/TMessagesProj/jni/x86_64" aether
                        mv "${GITHUB_WORKSPACE}/TMessagesProj/jni/x86_64/aether" "${GITHUB_WORKSPACE}/TMessagesProj/jni/x86_64/libaether.so"
                        chmod 755 "${GITHUB_WORKSPACE}/TMessagesProj/jni/x86_64/libaether.so"
                    fi

            -   name: Build APK
                run: |
                    echo "Target Architecture: ${TARGET_ARCH}"
                    # --no-configuration-cache: config-cache conflicts with --parallel on some tasks in Telegram
                    gradle :TMessagesProj_AppStandalone:assembleAfatStandalone \
                        --parallel \
                        --build-cache \
                        --max-workers=4 \
                        --no-configuration-cache \
                        2>&1 | tail -n 300; test ${PIPESTATUS[0]} -eq 0 || gradle :TMessagesProj_AppStandalone:assembleAfatStandalone --parallel --build-cache --max-workers=4 --no-configuration-cache

            -   name: ccache stats
                if: ${{always()}}
                run: |
                    echo "CCACHE_DIR=${CCACHE_DIR}"
                    du -sh "${CCACHE_DIR}" || true
                    ccache -s || true

            -   name: Restore Default Keystore
                if: ${{ always() && (inputs.multi-pass || 'Korben Dallas') == 'Korben Dallas' }}
                run: |
                    if [ -f "${GITHUB_WORKSPACE}/TMessagesProj/config/release.keystore.old" ]; then
                        rm -f "${GITHUB_WORKSPACE}/TMessagesProj/config/release.keystore"
                        mv "${GITHUB_WORKSPACE}/TMessagesProj/config/release.keystore.old" "${GITHUB_WORKSPACE}/TMessagesProj/config/release.keystore"
                    fi
                    if [ -f "${GITHUB_WORKSPACE}/gradle.properties.old" ]; then
                        rm -f "${GITHUB_WORKSPACE}/gradle.properties"
                        mv "${GITHUB_WORKSPACE}/gradle.properties.old" "${GITHUB_WORKSPACE}/gradle.properties"
                    fi

            -   name: Process and verify generated APKs
                id: locate_apk
                env:
                    VERSION_NAME: ${{ inputs.veyra-version || (github.ref_name == 'main' && '13.0.2' || '13.0.2-dev') }}
                run: |
                    APK_DIR="${GITHUB_WORKSPACE}/TMessagesProj_AppStandalone/build/outputs/apk/afat/standalone"
                    cd "$APK_DIR"
                    echo "=== Generated build artifacts ==="
                    ls -la

                    # Handle multi-arch splits (main / all build)
                    if [ -f "app-universal.apk" ]; then
                        mv "app-universal.apk" "Veyra.${VERSION_NAME}-universal.apk"
                    fi

                    for abi in arm64-v8a armeabi-v7a x86_64 x86; do
                        if [ -f "app-${abi}.apk" ]; then
                            mv "app-${abi}.apk" "Veyra.${VERSION_NAME}-${abi}.apk"
                        fi
                    done

                    # Handle single APK (dev / single-arch build)
                    if [ -f "app.apk" ]; then
                        mv "app.apk" "Veyra.${VERSION_NAME}-arm64-v8a.apk"
                    fi

                    # Remove any legacy untagged duplicate package
                    rm -f "Veyra.${VERSION_NAME}.apk"

                    echo "=== Final release packages ==="
                    ls -la Veyra.*.apk

                    # Calculate sha256 checksums
                    sha256sum Veyra.*.apk > "${APK_DIR}/SHA256SUMS.txt"
                    cat "${APK_DIR}/SHA256SUMS.txt"

                    if [ -f "${APK_DIR}/Veyra.${VERSION_NAME}-arm64-v8a.apk" ]; then
                        PRIMARY_APK="${APK_DIR}/Veyra.${VERSION_NAME}-arm64-v8a.apk"
                    elif [ -f "${APK_DIR}/Veyra.${VERSION_NAME}-universal.apk" ]; then
                        PRIMARY_APK="${APK_DIR}/Veyra.${VERSION_NAME}-universal.apk"
                    else
                        PRIMARY_APK=$(ls ${APK_DIR}/Veyra.*.apk | head -n 1)
                    fi
                    echo "apk_path=$PRIMARY_APK" >> "$GITHUB_OUTPUT"
                    echo "apk_sha256=$(sha256sum "$PRIMARY_APK" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

            -   name: Create Release and Upload APK
                id: gh_release
                uses: softprops/action-gh-release@v3
                with:
                    tag_name: ${{env.TNAME}}
                    name: ${{env.RNAME}}
                    prerelease: ${{ inputs.prerelease != '' && inputs.prerelease || github.ref_name != 'main' }}
                    files: |
                        TMessagesProj_AppStandalone/build/outputs/apk/afat/standalone/Veyra.*.apk
                        TMessagesProj_AppStandalone/build/outputs/apk/afat/standalone/SHA256SUMS.txt
                    body: |
                        **Veyra** `${{ env.VERSION_NAME }}` ${{ github.ref_name == 'main' && '— Stable Release 🎉' || '— Preview Build' }}
                        Target Architecture: `${{ env.TARGET_ARCH == 'all' && 'Universal + Dedicated per-architecture APKs (arm64-v8a, armeabi-v7a, x86, x86_64)' || env.TARGET_ARCH }}`

                        ${{ inputs.veyra-changes || (github.ref_name == 'main' && 'Veyra v13.0.2 — Stable Release' || 'Veyra v13.0.2 preview build on dev branch.') }}
                env:
                    GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
                    VERSION_NAME: ${{ inputs.veyra-version || (github.ref_name == 'main' && '13.0.2' || '13.0.2-dev') }}
                    RNAME: Veyra ${{ inputs.veyra-version || (github.ref_name == 'main' && '13.0.2' || '13.0.2-dev') }}
                    TNAME: v${{ inputs.veyra-version || (github.ref_name == 'main' && '13.0.2' || '13.0.2-dev') }}
